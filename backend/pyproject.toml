[project]
name = "hr-chatbot"
version = "0.1.0"
description = "Agentic RAG-based HR Chatbot for Resume Matching"
requires-python = ">=3.11"
authors = [{name = "HR Team", email = "hr@example.com"}]

dependencies = [
    "fastapi==0.162.7",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "langchain==1.4.9",
    "langgraph==1.2.21",
    "httpx==0.28.1",
    "python-docx==1.2.0",
    "pypdf==6.21.4",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "python-pptx==1.0.2",
    "pageindex>=0.1.0",
    "sqlalchemy==2.1.8",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.33",
    "aiofiles==25.1.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "black==26.10.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
override-dependencies = [
    "pillow>=13.0.0",
    "cryptography>=50.0.0",
    "dnspython>=2.9.0",
    "urllib3>=2.8.0",
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
]
